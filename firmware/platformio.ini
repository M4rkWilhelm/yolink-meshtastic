; Replacement firmware for the YoLink YS7805 outdoor motion sensor
; (YL09 = AcSiP S76S: STM32L073RZ + SX1276). See ../HARDWARE.md.

[platformio]
default_envs = ys7805

[env:ys7805]
platform = ststm32
framework = arduino
; STM32duino's AcSiP S76S variant: HSE + PLL at 32 MHz, same as the stock firmware.
board = acsip_s76s
lib_deps =
    jgromes/RadioLib@^7.1.2
    stm32duino/STM32duino Low Power@^2.0.0
    stm32duino/STM32duino RTC@^2.0.0
build_flags =
    ; The S76S runs from a 24 MHz crystal (the variant's PLL x4/3 assumes it), but
    ; the board definition doesn't say so and the HAL defaults to 8 MHz, which made
    ; every delay and timeout 3x too short. Measured over SWD.
    -D HSE_VALUE=24000000
    -D RADIOLIB_EXCLUDE_CC1101=1
    -D RADIOLIB_EXCLUDE_NRF24=1
    -D RADIOLIB_EXCLUDE_RF69=1
    -D RADIOLIB_EXCLUDE_SX1231=1
    -D RADIOLIB_EXCLUDE_SI443X=1
    -D RADIOLIB_EXCLUDE_RFM2X=1
    -D RADIOLIB_EXCLUDE_SX128X=1
    -D RADIOLIB_EXCLUDE_SX126X=1
    -D RADIOLIB_EXCLUDE_LR11X0=1
    -D RADIOLIB_EXCLUDE_AFSK=1
    -D RADIOLIB_EXCLUDE_AX25=1
    -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
    -D RADIOLIB_EXCLUDE_MORSE=1
    -D RADIOLIB_EXCLUDE_RTTY=1
    -D RADIOLIB_EXCLUDE_SSTV=1
    -D RADIOLIB_EXCLUDE_APRS=1
    -D RADIOLIB_EXCLUDE_BELL=1
    -D RADIOLIB_EXCLUDE_FSK4=1
    -D RADIOLIB_EXCLUDE_PAGER=1
    -D RADIOLIB_EXCLUDE_LORAWAN=1
    -D RADIOLIB_EXCLUDE_DIRECT_RECEIVE=1
; Flashing needs the hand-held-reset procedure; see ../tools/flash.sh.
upload_protocol = custom
upload_command = ../tools/flash.sh $SOURCE

; The packet encoder is checked on the host by test/run_packet_test.sh.

; Same firmware with RadioLib debug output captured in RAM (src/ramlog.cpp);
; read it over SWD with ../tools/ramlog.py.
[env:ys7805_debug]
extends = env:ys7805
build_flags =
    ${env:ys7805.build_flags}
    -D YL_DEBUG=1
    -include src/ramlog.h
    -D RADIOLIB_DEBUG_BASIC=1
    -D RADIOLIB_DEBUG_SPI=1
    -D RADIOLIB_DEBUG_PORT=g_ramLog

; Bench stress test for the intermittent hang hunt (see YL_STRESS in main.cpp).
; Never transmits. Not for deployment.
[env:ys7805_stress]
extends = env:ys7805_debug
build_flags = ${env:ys7805_debug.build_flags} -D YL_STRESS=1

; Same stress test with the core on the internal 16 MHz oscillator (clock.cpp).
[env:ys7805_stress_hsi16]
extends = env:ys7805_stress
build_flags = ${env:ys7805_stress.build_flags} -D YL_CLOCK_HSI16=1

; HSI16 stress test without the watchdog, so a hang stays put for the debugger.
[env:ys7805_stress_hsi16_nowdg]
extends = env:ys7805_stress_hsi16
build_flags = ${env:ys7805_stress_hsi16.build_flags} -D YL_NO_WATCHDOG=1

; Stress test on the release build (no RadioLib debug logging, no RAM log).
[env:ys7805_stress_release]
extends = env:ys7805
build_flags = ${env:ys7805.build_flags} -D YL_STRESS=1

; Wake-cost bench tests: wake 20 times a second, nothing else (YL_WAKETEST in
; main.cpp). Compare average current: clock (HSI16) and the 10 ms post-wake
; delay in STM32duino's LowPower_stop (skipped by default; YL_KEEP_WAKE_DELAY
; restores it). Results in HARDWARE.md (Power).
[env:ys7805_waketest]
extends = env:ys7805
build_flags = ${env:ys7805.build_flags} -D YL_WAKETEST=1

[env:ys7805_waketest_hsi16]
extends = env:ys7805
build_flags = ${env:ys7805.build_flags} -D YL_WAKETEST=1 -D YL_CLOCK_HSI16=1

[env:ys7805_waketest_delay]
extends = env:ys7805
build_flags = ${env:ys7805.build_flags} -D YL_WAKETEST=1 -D YL_KEEP_WAKE_DELAY=1

[env:ys7805_waketest_hsi16_delay]
extends = env:ys7805
build_flags = ${env:ys7805.build_flags} -D YL_WAKETEST=1 -D YL_CLOCK_HSI16=1 -D YL_KEEP_WAKE_DELAY=1

; Sleep-current probe: motion off, PB6 analog, one wake a second (YL_PROBE).
[env:ys7805_probe]
extends = env:ys7805
build_flags = ${env:ys7805.build_flags} -D YL_PROBE=1
