; PIR sensitivity measurement firmware for the YoLink YS7805 (not for normal use).
; Samples the PIR analog level (PC1) continuously and counts comparator edges
; (PB6) while PC2/PC3 hold a gain setting chosen over SWD. See src/main.cpp.

[env:pir_sensitivity]
platform = ststm32
framework = arduino
board = acsip_s76s
build_flags =
    -D HSE_VALUE=24000000
